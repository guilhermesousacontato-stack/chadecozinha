<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chá de cozinha - Renata e Guilherme</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap');

* { box-sizing: border-box; margin: 0; }

body {
  font-family: 'Inter', sans-serif;
  background: #fff6ea;
  color: #1c2030;
  min-height: 100vh;
}

.page {
  max-width: 540px;
  margin: 0 auto;
  padding: 56px 16px;
}

.event { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 28px; }

.event-icon {
  flex: none;
  width: 64px; height: 64px;
  border-radius: 18px;
  background: #f26b1d;
  display: grid; place-items: center;
}

h1 {
  font-family: 'Poppins', sans-serif;
  font-size: 22px;
  line-height: 1.25;
  font-weight: 700;
}

.meta {
  display: flex; flex-wrap: wrap; gap: 6px 18px;
  margin-top: 8px;
  font-size: 15px;
  color: #6b7280;
}
.meta span { display: inline-flex; align-items: center; gap: 6px; }

.card {
  background: #fff;
  border-radius: 20px;
  padding: 26px;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
  border: 1px solid #f3e9dc;
}

h2 { font-family: 'Poppins', sans-serif; font-size: 22px; font-weight: 700; }
.subtitle { margin: 8px 0 24px; color: #6b7280; font-size: 15px; line-height: 1.5; }

label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; color: #374151; }
label span { color: #dc2626; }

.input {
  display: flex; align-items: center; gap: 12px;
  border: 1px solid #e5e7eb;
  border-radius: 14px;
  padding: 0 16px;
  height: 52px;
  color: #9ca3af;
  margin-bottom: 16px;
  transition: border-color .2s, box-shadow .2s;
}
.input:focus-within { border-color: #f26b1d; box-shadow: 0 0 0 3px rgba(242,107,29,.15); }
.input input {
  flex: 1; border: 0; outline: 0; background: none;
  font: inherit; font-size: 16px; color: #1c2030;
  min-width: 0;
}
.input input::placeholder { color: #9ca3af; }

.companion { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.companion .input { flex: 1; margin-bottom: 0; }
.remove {
  width: 40px; height: 40px; flex: none;
  border: 0; border-radius: 12px;
  background: #fee2e2; color: #dc2626;
  font-size: 20px; cursor: pointer;
}

.add {
  width: 100%;
  display: flex; align-items: center; gap: 16px;
  padding: 16px;
  margin-bottom: 24px;
  background: #fff4e3;
  border: 1px solid #f9e0bd;
  border-radius: 16px;
  color: #c2410c;
  font: 600 16px 'Inter', sans-serif;
  cursor: pointer;
  transition: background .2s;
}
.add:hover { background: #ffecd0; }
.plus {
  width: 44px; height: 44px;
  border: 2px dashed #f26b1d;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 26px; font-weight: 400; color: #f26b1d;
}

.confirm {
  width: 100%; height: 48px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 12px;
  background: #f26b1d; color: #fff;
  font: 600 16px 'Inter', sans-serif;
  cursor: pointer;
  transition: background .2s, opacity .2s;
}
.confirm:hover:not(:disabled) { background: #d95a10; }
.confirm:disabled { opacity: .5; cursor: not-allowed; }

.success { text-align: center; padding: 20px 0; }
.success[hidden] { display: none; }
.check {
  width: 64px; height: 64px; margin: 0 auto 16px;
  border-radius: 50%;
  background: #dcfce7; color: #16a34a;
  display: grid; place-items: center;
  font-size: 32px;
}
.success p { margin-top: 8px; color: #6b7280; }

@media (max-width: 480px) {
  h1 { font-size: 19px; }
  .card { padding: 20px; }
}
</style>
</head>
<body>

<main class="page">
  <header class="event">
    <div class="event-icon">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/>
        <path d="M19 15l.7 2.3L22 18l-2.3.7L19 21l-.7-2.3L16 18l2.3-.7L19 15z"/>
        <path d="M5 16l.5 1.5L7 18l-1.5.5L5 20l-.5-1.5L3 18l1.5-.5L5 16z"/>
      </svg>
    </div>
    <div class="event-info">
      <h1>Chá de cozinha - Renata e Guilherme.</h1>
      <p class="meta">
        <span>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          Domingo, 12 de dezembro
        </span>
        <span>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          14h30
        </span>
      </p>
      <p class="meta">
        <span>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0116 0z"/><circle cx="12" cy="10" r="3"/></svg>
          The Brick - Salão Marketplace
        </span>
      </p>
    </div>
  </header>

  <section class="card">
    <h2>Confirme sua presença</h2>
    <p class="subtitle">Preencha seus dados para confirmar e informe se vai levar acompanhantes.</p>

    <form id="rsvp" novalidate>
      <label for="nome">Seu nome completo <span>*</span></label>
      <div class="input">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        <input id="nome" type="text" placeholder="Digite seu nome completo" autocomplete="name" />
      </div>

      <div id="acompanhantes"></div>

      <button type="button" id="add" class="add">
        <span class="plus">+</span>
        Adicionar acompanhante
      </button>

      <button type="submit" id="confirmar" class="confirm" disabled>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>
        Confirmar Presença
      </button>
    </form>

    <div id="sucesso" class="success" hidden>
      <div class="check">✓</div>
      <h2>Presença confirmada!</h2>
      <p id="sucesso-texto"></p>
    </div>
  </section>
</main>

<script>
const form = document.getElementById('rsvp');
const nome = document.getElementById('nome');
const lista = document.getElementById('acompanhantes');
const btnAdd = document.getElementById('add');
const btnConfirmar = document.getElementById('confirmar');
const sucesso = document.getElementById('sucesso');
const sucessoTexto = document.getElementById('sucesso-texto');

const iconeUser = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>`;

function validar() {
  btnConfirmar.disabled = nome.value.trim().length < 3;
}
nome.addEventListener('input', validar);

btnAdd.addEventListener('click', () => {
  const row = document.createElement('div');
  row.className = 'companion';
  row.innerHTML = `
    <div class="input">
      ${iconeUser}
      <input type="text" placeholder="Nome do acompanhante" />
    </div>
    <button type="button" class="remove" aria-label="Remover">×</button>
  `;
  row.querySelector('.remove').addEventListener('click', () => row.remove());
  lista.appendChild(row);
  row.querySelector('input').focus();
});

form.addEventListener('submit', (e) => {
  e.preventDefault();
  if (btnConfirmar.disabled) return;

  const acompanhantes = [...lista.querySelectorAll('input')]
    .map(i => i.value.trim())
    .filter(Boolean);

  const dados = { nome: nome.value.trim(), acompanhantes };
  console.log('Confirmação:', dados);

  form.hidden = true;
  sucesso.hidden = false;
  sucessoTexto.textContent = acompanhantes.length
    ? `Obrigado, ${dados.nome}! Te esperamos com ${acompanhantes.length} acompanhante(s).`
    : `Obrigado, ${dados.nome}! Te esperamos lá.`;
});
</script>

</body>
</html>
